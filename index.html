<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        display: grid;
        grid-template-columns: repeat(4,1fr);
        column-gap: 20px;
        row-gap: 20px;
        
      }
      .child
      {
        background-color: yellow;
      }

      .child:nth-child(7){
        background-color: green;
        grid-column: 1 /span 3;
        /* animation: name duration timing-function delay iteration-count direction ; */
        animation: spin 2s linear infinite ;
      }

      



    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
      <div class="child">
        <img src="./image.png" height="100px" width="100px" alt="" />
      </div>
    </div>
  </body>
</html>
